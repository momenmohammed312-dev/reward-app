name: MO2 Loyalty CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Build, Migrations & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: loyalty_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply PostgreSQL schema and migrations
        env:
          PGPASSWORD: ci_postgres_password
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d loyalty_ci -v ON_ERROR_STOP=1 -f DB/schema.sql
          for f in DB/migrations/*.sql; do
            echo "Applying $f..."
            psql -h localhost -U postgres -d loyalty_ci -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Build backend TypeScript
        working-directory: backend
        run: npm run build

      - name: Run backend unit tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key
        run: npm test

  ui:
    name: UI Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Install UI dependencies
        working-directory: UI
        run: npm ci --legacy-peer-deps

      - name: Typecheck UI
        working-directory: UI
        run: npm run lint

      - name: Build UI bundle
        working-directory: UI
        run: npm run build
