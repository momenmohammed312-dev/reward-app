version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: loyalty-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loyalty
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./DB/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./DB/migrations/001_add_tier_tables.sql:/docker-entrypoint-initdb.d/02-migration-001.sql
      - ./DB/migrations/002_add_rewards_table.sql:/docker-entrypoint-initdb.d/03-migration-002.sql
      - ./DB/migrations/003_add_tenant_branding.sql:/docker-entrypoint-initdb.d/04-migration-003.sql
      - ./DB/migrations/004_add_superadmin_role.sql:/docker-entrypoint-initdb.d/05-migration-004.sql
      - ./DB/migrations/005_admin_audit_soft_delete.sql:/docker-entrypoint-initdb.d/06-migration-005.sql
      - ./DB/migrations/006_branch_timezone_working_hours.sql:/docker-entrypoint-initdb.d/07-migration-006.sql
      - ./DB/migrations/007_cross_tenant_networks.sql:/docker-entrypoint-initdb.d/08-migration-007.sql
      - ./DB/migrations/008_wallet_ledger_idempotency.sql:/docker-entrypoint-initdb.d/09-migration-008.sql
      - ./DB/migrations/009_reversal_ledger_type.sql:/docker-entrypoint-initdb.d/10-migration-009.sql
      - ./DB/migrations/010_branch_users.sql:/docker-entrypoint-initdb.d/11-migration-010.sql
      - ./DB/migrations/011_pos_integrations.sql:/docker-entrypoint-initdb.d/12-migration-011.sql
      - ./DB/migrations/012_pos_customer_verification.sql:/docker-entrypoint-initdb.d/13-migration-012.sql
      - ./DB/migrations/013_webhook_idempotency_and_rewards_concurrency.sql:/docker-entrypoint-initdb.d/14-migration-013.sql
      - ./DB/migrations/014_outbox_events_and_schema_migrations.sql:/docker-entrypoint-initdb.d/15-migration-014.sql
      - ./DB/migrations/015_point_exchange_rates.sql:/docker-entrypoint-initdb.d/16-migration-015.sql
      - ./DB/migrations/016_network_points_ledger.sql:/docker-entrypoint-initdb.d/17-migration-016.sql
      - ./DB/migrations/017_network_settlements.sql:/docker-entrypoint-initdb.d/18-migration-017.sql
      - ./DB/migrations/018_network_customers.sql:/docker-entrypoint-initdb.d/19-migration-018.sql
      - ./DB/migrations/019_supermarket_support.sql:/docker-entrypoint-initdb.d/20-migration-019.sql
      - ./DB/migrations/020_manager_suite_and_growth.sql:/docker-entrypoint-initdb.d/21-migration-020.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: loyalty-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loyalty-api
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/loyalty
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET environment variable is required}
      OTP_EXPIRY_MINUTES: 5
      SMS_PROVIDER: console
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
